[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qpcr-rhythm-guard"
version = "0.1.0"
description = "Auditable qPCR QC and conservative fixed-period cosinor analysis"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.24,<3", "scipy>=1.10,<2", "matplotlib>=3.7,<4"]

[project.scripts]
qpcr-rhythm-guard = "qpcr_rhythm_guard.__main__:main"

[project.urls]
Repository = "https://github.com/Gaikunxingle/qpcr-rhythm-guard"
Issues = "https://github.com/Gaikunxingle/qpcr-rhythm-guard/issues"

[tool.setuptools.packages.find]
include = ["qpcr_rhythm_guard*"]
